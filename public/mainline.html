<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0d0f" />
    <title>Mainline — a record of what got built</title>
    <meta
      name="description"
      content="A social record for people who build software. Publish a project, follow makers, and see what shipped."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0d0f;
        --surface: #141518;
        --elevated: #1b1d21;
        --fg: #eceae6;
        --muted: #b7b2a8;
        --subtle: #8d887f;
        --line: #2a2c31;
        --line-strong: #3c3f46;
        --danger: #c45c4a;
        --sans: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
        --display: "Newsreader", "Iowan Old Style", Palatino, Georgia, serif;
        --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }
      html { min-width: 320px; background: var(--bg); scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button, input, textarea, select { font: inherit; }
      button:not(:disabled), a, [role="button"] { cursor: pointer; }
      button { color: inherit; }
      a { color: inherit; text-decoration: none; }
      h1, h2, h3, p { margin-top: 0; }
      h1, h2, h3 { text-wrap: balance; }
      p { text-wrap: pretty; }
      :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
      ::selection { background: var(--fg); color: var(--bg); }

      .topbar {
        position: sticky;
        z-index: 5;
        top: 0;
        border-bottom: 1px solid var(--line);
        background: rgb(12 13 15 / 94%);
        backdrop-filter: blur(16px);
      }
      .topbar-inner, .page, .bottom-inner {
        width: min(100% - 32px, 960px);
        margin-inline: auto;
      }
      .topbar-inner {
        display: flex;
        min-height: 68px;
        align-items: center;
        gap: 18px;
      }
      .brand { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 10px; }
      .brand-mark {
        position: relative;
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid var(--line);
        background: var(--surface);
        font-family: var(--display);
        font-size: 18px;
      }
      .brand-mark::before {
        position: absolute;
        top: 8px;
        right: 6px;
        left: 6px;
        height: 1px;
        background: var(--fg);
        content: "";
      }
      .brand-name { font-family: var(--display); font-size: 23px; letter-spacing: -.03em; }
      .desktop-nav { display: flex; align-items: center; gap: 5px; }
      .nav-link, .auth-link, .quiet-link {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 10px;
        color: var(--muted);
        font-size: 14px;
      }
      .nav-link:hover, .auth-link:hover, .quiet-link:hover, .nav-link[aria-current="page"] { color: var(--fg); }
      .search-form { display: flex; min-width: 120px; max-width: 280px; flex: 1; margin-left: auto; }
      .mobile-search { display: none; margin-top: 17px; }
      .input, .select, .textarea, .search-input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        color: var(--fg);
      }
      .search-input { min-height: 42px; padding: 0 12px; }
      .search-input::placeholder, .input::placeholder, .textarea::placeholder { color: var(--subtle); }
      .input, .select { min-height: 46px; padding: 0 12px; }
      .textarea { min-height: 120px; padding: 12px; resize: vertical; }
      .textarea.tall { min-height: 190px; }
      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        padding: 0 15px;
        color: var(--fg);
        font-size: 14px;
        font-weight: 500;
        transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
      }
      .button:hover { border-color: var(--line-strong); background: var(--elevated); }
      .button:active:not(:disabled) { transform: scale(.98); }
      .button.primary { border-color: var(--fg); background: var(--fg); color: #141311; }
      .button.primary:hover { background: #d7d4ce; }
      .button.danger { color: #f0a195; }
      .button.small { min-height: 36px; padding-inline: 11px; font-size: 13px; }
      .button:disabled { cursor: wait; opacity: .6; }
      .publish-link { flex: 0 0 auto; }
      .auth-slot { display: flex; flex: 0 0 auto; align-items: center; }
      .user-label { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .page { min-height: calc(100vh - 68px); padding-top: 34px; padding-bottom: 92px; }
      .page-title { margin-bottom: 0; font-family: var(--display); font-size: clamp(38px, 6vw, 56px); font-weight: 500; letter-spacing: -.04em; line-height: 1.04; }
      .lede { max-width: 620px; margin: 13px 0 0; color: var(--muted); }
      .subtle { color: var(--subtle); }
      .muted { color: var(--muted); }
      .mono { font-family: var(--mono); font-size: 12px; }
      .tabular { font-variant-numeric: tabular-nums; }
      .feed-layout { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 42px; }
      .feed-tools { display: flex; min-height: 56px; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
      .chips { display: flex; min-width: 0; gap: 8px; overflow-x: auto; padding: 3px 1px 5px; scrollbar-width: thin; }
      .chip {
        display: inline-flex;
        min-height: 38px;
        flex: 0 0 auto;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        padding: 0 12px;
        color: var(--muted);
        font-size: 13px;
      }
      .chip:hover { color: var(--fg); }
      .chip.active { border-color: var(--fg); background: var(--fg); color: #141311; }
      .sorts { display: flex; flex: 0 0 auto; gap: 14px; }
      .sort-link { display: inline-flex; min-height: 38px; align-items: center; border-bottom: 1px solid transparent; color: var(--subtle); font-size: 13px; }
      .sort-link.active { border-bottom-color: var(--fg); color: var(--fg); }
      .project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 20px; }
      .project-card { display: flex; min-width: 0; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
      .project-card.featured { grid-column: 1 / -1; }
      .project-card-link { display: block; min-width: 0; }
      .project-card-link:hover h2 { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; }
      .cover {
        position: relative;
        height: 116px;
        overflow: hidden;
        background-color: var(--elevated);
        color: var(--line-strong);
      }
      .featured .cover { height: 192px; }
      .cover::after {
        position: absolute;
        bottom: 11px;
        left: 15px;
        color: var(--fg);
        content: attr(data-language);
        font-family: var(--mono);
        font-size: 11px;
      }
      .cover.lines { background-image: repeating-linear-gradient(0deg, transparent 0 31px, var(--line-strong) 32px, transparent 33px); }
      .cover.bars { background-image: repeating-linear-gradient(90deg, transparent 0 28px, var(--line-strong) 29px, transparent 30px); }
      .cover.diagonal { background-image: repeating-linear-gradient(130deg, transparent 0 39px, var(--line-strong) 40px, transparent 41px); }
      .cover.rings::before, .cover.rings::after {
        position: absolute;
        top: -50px;
        right: -14px;
        width: 180px;
        height: 180px;
        border: 1px solid currentColor;
        border-radius: 50%;
        content: "";
      }
      .cover.rings::after { top: -20px; right: 16px; width: 120px; height: 120px; box-shadow: 0 0 0 28px transparent, 0 0 0 29px currentColor; }
      .card-copy { padding: 14px 16px 9px; }
      .card-copy h2 { margin: 0; font-family: var(--display); font-size: 25px; font-weight: 500; letter-spacing: -.025em; line-height: 1.15; }
      .featured .card-copy h2 { font-size: 40px; }
      .card-copy p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
      .featured .card-copy p { max-width: 640px; font-size: 16px; }
      .card-tags { margin-top: 11px; color: var(--subtle); font-family: var(--mono); font-size: 11px; }
      .card-meta { display: flex; min-height: 52px; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding: 0 13px; }
      .author-link { min-width: 0; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
      .author-link:hover { color: var(--fg); }
      .star-button { display: inline-flex; min-height: 40px; flex: 0 0 auto; align-items: center; gap: 7px; border: 0; background: transparent; padding: 0 4px; color: var(--muted); font-size: 13px; }
      .star-button:hover, .star-button.starred { color: var(--fg); }
      .star-mark { font-size: 18px; line-height: 1; }
      .side-count { color: var(--subtle); font-family: var(--mono); font-size: 11px; }
      .side-heading { margin: 21px 0 10px; font-family: var(--display); font-size: 27px; font-weight: 500; letter-spacing: -.02em; }
      .maker-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .maker-list li + li { border-top: 1px solid var(--line); }
      .maker-row { display: flex; min-height: 47px; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 0; }
      .maker-row span:first-child { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
      .maker-role { flex: 0 0 auto; color: var(--subtle); font-size: 11px; }
      .text-link { display: inline-flex; min-height: 42px; align-items: center; color: var(--muted); font-size: 13px; }
      .text-link:hover { color: var(--fg); }
      .section { margin-top: 40px; }
      .section-label { margin-bottom: 12px; color: var(--subtle); font-size: 13px; }
      .list { margin: 0; padding: 0; list-style: none; border-block: 1px solid var(--line); }
      .list-item { display: grid; grid-template-columns: minmax(130px, 190px) minmax(0, 1fr) auto; align-items: center; gap: 18px; padding: 16px 0; }
      .list-item + .list-item { border-top: 1px solid var(--line); }
      .list-item-title { font-family: var(--display); font-size: 24px; }
      .list-item-copy { overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
      .maker-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .maker-card { display: flex; min-width: 0; gap: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 15px; }
      .monogram { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border: 1px solid var(--line); background: var(--elevated); font-family: var(--display); font-size: 21px; }
      .maker-card-copy { min-width: 0; }
      .maker-card-copy strong, .maker-card-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .maker-card-copy span { margin-top: 3px; color: var(--muted); font-size: 12px; }
      .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px 20px; }
      .tag-link { display: inline-flex; min-height: 42px; align-items: center; color: var(--muted); font-family: var(--mono); font-size: 12px; }
      .tag-link span { margin-left: 8px; color: var(--subtle); }
      .tag-link:hover { color: var(--fg); }
      .empty { margin-top: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 24px; }
      .empty h2 { margin-bottom: 7px; font-family: var(--display); font-size: 25px; font-weight: 500; }
      .empty p { margin-bottom: 14px; color: var(--muted); font-size: 14px; }
      .profile-head { display: flex; align-items: flex-start; gap: 18px; }
      .profile-head .monogram { width: 64px; height: 64px; font-size: 30px; }
      .profile-title { margin: 0; font-family: var(--display); font-size: clamp(35px, 5vw, 48px); font-weight: 500; letter-spacing: -.04em; line-height: 1.05; }
      .profile-meta { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
      .profile-bio { max-width: 600px; margin: 14px 0 0; }
      .profile-stats { margin: 14px 0 0; color: var(--subtle); font-size: 13px; }
      .button-row { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 17px; }
      .form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 225px; gap: 44px; }
      .form { display: grid; gap: 17px; margin-top: 26px; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .field { display: grid; gap: 7px; }
      .field label { color: var(--muted); font-size: 13px; }
      .field-hint { color: var(--subtle); font-size: 12px; }
      .language-picker { display: flex; flex-wrap: wrap; gap: 7px; }
      .form-error { min-height: 20px; color: #f0a195; font-size: 13px; }
      .preview-card { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
      .preview-card-copy { padding: 14px; }
      .preview-card-copy h2 { margin: 0; font-family: var(--display); font-size: 25px; font-weight: 500; }
      .preview-card-copy p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
      .project-detail-cover { height: 208px; margin-top: 18px; border: 1px solid var(--line); border-radius: 10px; }
      .detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 34px; margin-top: 26px; }
      .detail-title { margin: 0; font-family: var(--display); font-size: clamp(40px, 6vw, 58px); font-weight: 500; letter-spacing: -.04em; line-height: 1.02; }
      .detail-summary { max-width: 660px; margin: 14px 0 0; color: var(--muted); font-size: 18px; }
      .detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 9px 16px; margin-top: 18px; color: var(--subtle); font-size: 13px; }
      .detail-writeup { display: grid; gap: 16px; margin-top: 30px; }
      .detail-writeup p { margin: 0; font-size: 16px; line-height: 1.75; }
      .detail-writeup pre { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; background: #090a0b; padding: 15px; color: var(--fg); font-family: var(--mono); font-size: 13px; line-height: 1.65; }
      .detail-aside { align-self: start; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 15px; }
      .detail-aside p { margin: 0; color: var(--muted); font-size: 13px; }
      .detail-aside p + p { margin-top: 5px; color: var(--subtle); font-size: 12px; }
      .out-links { display: grid; gap: 7px; margin-top: 15px; }
      .out-link { display: flex; min-height: 42px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 4px; padding: 0 10px; font-size: 13px; }
      .notes { margin-top: 42px; border-top: 1px solid var(--line); padding-top: 25px; }
      .notes h2 { margin: 0; font-family: var(--display); font-size: 29px; font-weight: 500; }
      .note-item { border-bottom: 1px solid var(--line); padding: 16px 0; }
      .note-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .note-item p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
      .note-form { margin-top: 24px; }
      .auth-panel { width: min(100%, 430px); margin: 8vh auto 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 24px; }
      .auth-panel h1 { margin: 0; font-family: var(--display); font-size: 37px; font-weight: 500; letter-spacing: -.03em; }
      .auth-panel > p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
      .auth-panel .form { margin-top: 22px; }
      .toast-region { position: fixed; z-index: 20; right: 16px; bottom: 18px; display: grid; gap: 8px; }
      .toast { max-width: min(360px, calc(100vw - 32px)); border: 1px solid var(--line-strong); border-radius: 6px; background: var(--elevated); padding: 12px 15px; color: var(--fg); font-size: 13px; box-shadow: 0 8px 30px rgb(0 0 0 / 30%); }
      .bottom-nav { display: none; }
      .loading { color: var(--muted); }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }

      @media (max-width: 760px) {
        .desktop-nav { display: none; }
        .topbar-inner, .page, .bottom-inner { width: min(100% - 28px, 640px); }
        .topbar-inner { min-height: 62px; gap: 10px; }
        .brand-name { font-size: 21px; }
        .search-form { display: none; }
        .mobile-search { display: flex; }
        .publish-link { display: none; }
        .auth-link { padding-inline: 7px; }
        .user-label { max-width: 90px; }
        .page { min-height: calc(100vh - 62px); padding-top: 26px; padding-bottom: 98px; }
        .feed-layout, .form-layout, .detail-layout { grid-template-columns: 1fr; gap: 25px; }
        .feed-layout aside { display: none; }
        .feed-tools { align-items: flex-start; flex-direction: column; gap: 8px; }
        .chips { width: 100%; }
        .sorts { align-self: flex-end; }
        .project-grid { gap: 11px; }
        .project-card { border-radius: 8px; }
        .cover { height: 96px; }
        .featured .cover { height: 150px; }
        .card-copy { padding: 12px 12px 7px; }
        .card-copy h2 { font-size: 21px; }
        .featured .card-copy h2 { font-size: 32px; }
        .card-copy p { font-size: 13px; }
        .featured .card-copy p { font-size: 14px; }
        .card-meta { min-height: 46px; padding-inline: 10px; }
        .author-link { font-size: 11px; }
        .star-button { gap: 5px; font-size: 12px; }
        .list-item { grid-template-columns: minmax(90px, 130px) minmax(0, 1fr) auto; gap: 10px; }
        .list-item-title { font-size: 20px; }
        .maker-grid { grid-template-columns: 1fr; }
        .detail-aside { order: -1; }
        .project-detail-cover { height: 160px; }
        .bottom-nav { position: fixed; z-index: 10; right: 0; bottom: 0; left: 0; display: block; border-top: 1px solid var(--line); background: rgb(12 13 15 / 96%); padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(16px); }
        .bottom-inner { display: grid; grid-template-columns: repeat(4, 1fr); min-height: 60px; }
        .bottom-link { display: flex; min-height: 58px; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--subtle); font-size: 11px; }
        .bottom-link[aria-current="page"] { color: var(--fg); }
        .bottom-glyph { font-family: var(--display); font-size: 18px; line-height: 1; }
      }
      @media (max-width: 430px) {
        .project-grid { grid-template-columns: 1fr; }
        .project-card.featured { grid-column: auto; }
        .featured .cover { height: 158px; }
        .form-grid { grid-template-columns: 1fr; }
        .profile-head { gap: 12px; }
        .profile-head .monogram { width: 54px; height: 54px; font-size: 25px; }
        .list-item { grid-template-columns: 1fr auto; }
        .list-item-copy { grid-column: 1 / -1; grid-row: 2; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/" aria-label="Mainline home">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span class="brand-name">Mainline</span>
        </a>
        <nav class="desktop-nav" aria-label="Main navigation">
          <a class="nav-link" data-nav="explore" href="#/explore">Index</a>
          <a class="nav-link" data-nav="you" href="#/you">Bench</a>
        </nav>
        <form class="search-form" id="search-form" role="search">
          <label class="sr-only" for="record-search">Search projects</label>
          <input class="search-input" id="record-search" name="q" placeholder="Search projects" />
        </form>
        <a class="button primary publish-link" href="#/new">＋ Publish</a>
        <div class="auth-slot" id="auth-slot"></div>
      </div>
    </header>
    <main class="page" id="app" aria-live="polite">
      <p class="loading">Connecting to the record…</p>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <div class="bottom-inner">
        <a class="bottom-link" data-nav="feed" href="#/"><span class="bottom-glyph">M</span>Record</a>
        <a class="bottom-link" data-nav="explore" href="#/explore"><span class="bottom-glyph">⌕</span>Index</a>
        <a class="bottom-link" data-nav="new" href="#/new"><span class="bottom-glyph">＋</span>Publish</a>
        <a class="bottom-link" data-nav="you" href="#/you"><span class="bottom-glyph">◎</span>Bench</a>
      </div>
    </nav>
    <div class="toast-region" id="toasts" aria-live="polite"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-app.js";
      import {
        createUserWithEmailAndPassword,
        getAuth,
        GoogleAuthProvider,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        signInWithPopup,
        signOut,
        updateProfile,
      } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-auth.js";
      import {
        getDatabase,
        onValue,
        push,
        ref,
        remove,
        serverTimestamp,
        set,
        update,
      } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

      const firebaseConfig = {

        databaseURL: "https://kiko-chat-b6435-default-rtdb.firebaseio.com",
        projectId: "kiko-chat-b6435",
        storageBucket: "kiko-chat-b6435.firebasestorage.app",

        appId: "1:896370793240:web:3f14442a5d80cd71fb1c6d",
        measurementId: "G-FB55ZBH15N",
      };

      const LANGUAGES = ["TypeScript", "Rust", "Go", "Python", "Swift", "Kotlin", "Zig", "C"];
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);
      const mainlineRef = ref(db, "mainline");
      const state = {
        user: null,

        ready: false,
        error: "",
        authMode: "login",
        editingProjectId: "",
      };
      const appEl = document.getElementById("app");
      let stopWatchingData = () => {};

      function escapeHtml(value = "") {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[char]);
      }

      function safeUrl(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        try {
          const parsed = new URL(raw);
          return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : "";
        } catch {
          return "";
        }
      }

      function slug(value) {
        return String(value || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24);
      }

      function tagsFrom(value) {
        return [...new Set(String(value || "").split(/[,\s]+/).map((tag) => tag.toLowerCase().replace(/[^a-z0-9-]/g, "")).filter((tag) => tag.length >= 2 && tag.length <= 24))].slice(0, 6);
      }

      function countLabel(count, word) {
        return `${count} ${word}${count === 1 ? "" : "s"}`;
      }

      function dateLabel(value) {
        const date = new Date(Number(value) || value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short", year: "numeric" }).format(date);
      }

      function hashNumber(value) {
        let hash = 0;
        for (const char of String(value)) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
        return hash;
      }

      function projectEntries() {
        return Object.entries(state.data.projects || {}).map(([id, raw]) => {
          const profile = state.data.profiles?.[raw.ownerUid] || {};
          const stars = state.data.stars?.[id] || {};
          const notes = state.data.notes?.[id] || {};
          return {
            ...raw,
            id,
            tags: Array.isArray(raw.tags) ? raw.tags : tagsFrom(raw.tags),
            authorHandle: profile.handle || raw.authorHandle || "",
            authorName: profile.displayName || raw.authorName || "Maker",
            authorRole: profile.role || "",
            authorLocation: profile.location || "",
            starCount: Object.keys(stars).length,
            noteCount: Object.keys(notes).length,
          };
        });
      }

      function profileByHandle(handle) {
        const uid = state.data.handles?.[handle];
        if (uid && state.data.profiles?.[uid]) return { ...state.data.profiles[uid], uid };
        const found = Object.entries(state.data.profiles || {}).find(([, profile]) => profile.handle === handle);
        return found ? { ...found[1], uid: found[0] } : null;
      }

      function profileProjects(uid) {
        return projectEntries().filter((project) => project.ownerUid === uid).sort((a, b) => Number(b.createdAt) - Number(a.createdAt));
      }

      function isFollowing(targetUid) {
        return Boolean(state.user && state.data.follows?.[state.user.uid]?.[targetUid]);
      }

      function followersOf(targetUid) {
        return Object.values(state.data.follows || {}).filter((list) => list?.[targetUid]).length;

      function followingCount(uid) {

      }

      function monogram(name) {
        return `<span class="monogram" aria-hidden="true">${escapeHtml((name || "M").trim().charAt(0).toUpperCase() || "M")}</span>`;
      }

      function cover(project, extra = "") {
        const patterns = ["lines", "bars", "rings", "diagonal"];
        return `<div class="cover ${patterns[hashNumber(project.id) % patterns.length]} ${extra}" data-language="${escapeHtml(project.language)}" aria-hidden="true"></div>`;
      }

      function starButton(project) {
        const starred = Boolean(state.user && state.data.stars?.[project.id]?.[state.user.uid]);

      }

      function card(project, featured = false) {
        const tags = project.tags.slice(0, 3).join(" · ");
        return `<article class="project-card ${featured ? "featured" : ""}">
          <a class="project-card-link" href="#/project/${encodeURIComponent(project.id)}">
            ${cover(project)}
            <div class="card-copy">
              <h2>${escapeHtml(project.title)}</h2>
              <p>${escapeHtml(project.summary)}</p>
              ${tags ? `<div class="card-tags">${escapeHtml(tags)}</div>` : ""}
            </div>
          </a>
          <div class="card-meta">
            <a class="author-link" href="#/u/${encodeURIComponent(project.authorHandle)}">${escapeHtml(project.authorName)}<span class="subtle"> · ${escapeHtml(dateLabel(project.createdAt))}</span></a>
            ${starButton(project)}
          </div>
        </article>`;
      }

      function makers() {
        return Object.entries(state.data.profiles || {}).map(([uid, profile]) => ({
          ...profile,
          uid,
          projects: profileProjects(uid).length,
          followers: followersOf(uid),
        })).sort((a, b) => b.followers - a.followers || String(a.displayName).localeCompare(String(b.displayName)));
      }

      function counts() {
        const projects = projectEntries();
        const languages = new Map();
        const tags = new Map();
        for (const project of projects) {
          const language = languages.get(project.language) || { name: project.language, count: 0, top: project, topStars: -1 };
          language.count += 1;
          if (project.starCount > language.topStars) {
            language.top = project;
            language.topStars = project.starCount;
          }
          languages.set(project.language, language);
          for (const tag of project.tags) tags.set(tag, (tags.get(tag) || 0) + 1);
        }
        return {
          projects,
          languages: [...languages.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name)),
          tags: [...tags].map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name)).slice(0, 24),
        };
      }

      function route() {
        const raw = location.hash.replace(/^#\/?/, "");
        const [path = "", query = ""] = raw.split("?");
        const params = new URLSearchParams(query);
        const parts = path.split("/").filter(Boolean).map(decodeURIComponent);
        return { page: parts[0] || "feed", id: parts[1] || "", q: (params.get("q") || "").slice(0, 80), lang: (params.get("lang") || "").slice(0, 40), sort: params.get("sort") === "stars" ? "stars" : "new" };
      }

      function setFeedRoute({ q = "", lang = "", sort = "new" } = {}) {
        const params = new URLSearchParams();
        if (q) params.set("q", q);
        if (lang) params.set("lang", lang);
        if (sort === "stars") params.set("sort", sort);
        location.hash = `#/${params.size ? `?${params}` : ""}`;
      }

      function setFormError(form, message) {
        const target = form?.querySelector(".form-error");
        if (target) target.textContent = message;
      }

      function toast(message) {
        const region = document.getElementById("toasts");
        const item = document.createElement("div");
        item.className = "toast";
        item.textContent = message;
        region.append(item);
        setTimeout(() => item.remove(), 3600);
      }

      function updateHeader(current) {
        document.getElementById("auth-slot").innerHTML = state.user
          ? `<span class="auth-link user-label">${escapeHtml(state.user.displayName || state.user.email || "Maker")}</span><button class="button small" type="button" data-action="signout">Sign out</button>`
          : `<a class="auth-link" href="#/login">Sign in</a>`;
        const search = document.getElementById("record-search");
        if (search && document.activeElement !== search) search.value = current.page === "feed" ? current.q : "";
        document.querySelectorAll("[data-nav]").forEach((item) => {
          const nav = item.dataset.nav;
          const active = (nav === "feed" && current.page === "feed") || nav === current.page || (nav === "new" && current.page === "new");
          if (active) item.setAttribute("aria-current", "page");
          else item.removeAttribute("aria-current");
        });
      }

      function shellError() {
        const message = state.error || "The Firebase record could not be loaded.";
        return `<section class="empty"><h2>Could not reach the record</h2><p>${escapeHtml(message)}</p><p class="subtle">Check that Email/Password sign-in is enabled and the Firebase Realtime Database rules are published.</p><button class="button" type="button" data-action="retry">Try again</button></section>`;
      }

      function emptyState(title, message, action = "") {
        return `<section class="empty"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(message)}</p>${action}</section>`;
      }

      function renderFeed(current) {
        const directory = counts();
        let projects = directory.projects;
        if (current.q) {
          const query = current.q.toLowerCase();
          projects = projects.filter((project) => [project.title, project.summary, project.authorName, project.authorRole, project.tags.join(" ")].join(" ").toLowerCase().includes(query));
        }
        if (current.lang) projects = projects.filter((project) => project.language === current.lang);
        projects.sort((a, b) => current.sort === "stars"
          ? b.starCount - a.starCount || Number(b.createdAt) - Number(a.createdAt)
          : Number(b.createdAt) - Number(a.createdAt));
        projects = projects.slice(0, 60);
        const title = current.q ? `Results for “${current.q}”` : current.lang || (current.sort === "stars" ? "Most starred" : "What got built.");
        const languageChips = directory.languages.map((language) => `<button class="chip ${current.lang === language.name ? "active" : ""}" type="button" data-action="language" data-lang="${escapeHtml(language.name)}">${escapeHtml(language.name)}</button>`).join("");
        const first = projects[0];
        return `<div class="feed-layout">
          <section>
            <h1 class="page-title">${escapeHtml(title)}</h1>
            <p class="lede">${!current.q && !current.lang && current.sort === "new" ? "A record of projects, not a feed of opinions. Publish the work. Star what you would run." : escapeHtml(countLabel(projects.length, "project"))}</p>
            <form class="mobile-search" id="mobile-search-form" role="search"><label class="sr-only" for="mobile-record-search">Search projects</label><input class="search-input" id="mobile-record-search" name="q" value="${escapeHtml(current.q)}" placeholder="Search projects"></form>
            <div class="feed-tools">
              <div class="chips"><button class="chip ${!current.lang ? "active" : ""}" type="button" data-action="language" data-lang="">All</button>${languageChips}</div>
              <div class="sorts"><a class="sort-link ${current.sort === "new" ? "active" : ""}" href="#/${current.q || current.lang ? `?q=${encodeURIComponent(current.q)}&lang=${encodeURIComponent(current.lang)}` : ""}">Newest</a><a class="sort-link ${current.sort === "stars" ? "active" : ""}" href="#/?q=${encodeURIComponent(current.q)}&lang=${encodeURIComponent(current.lang)}&sort=stars">Starred</a></div>
            </div>
            ${projects.length ? `<div class="project-grid">${card(first, projects.length > 1)}${projects.slice(1).map((project) => card(project)).join("")}</div>` : emptyState("Nothing on the record matches that.", current.q || current.lang ? "Try another search or clear the language filter." : "Be the first maker to publish a project.", `<a class="button primary" href="#/new">Publish a project</a>`)}
          </section>
          <aside>
            <p class="side-count">${countLabel(directory.projects.length, "project")} on the record</p>
            <h2 class="side-heading">Makers</h2>
            ${makers().length ? `<ul class="maker-list">${makers().slice(0, 8).map((maker) => `<li><a class="maker-row" href="#/u/${encodeURIComponent(maker.handle)}"><span>${escapeHtml(maker.displayName)}</span><span class="maker-role">${escapeHtml(maker.role || "Builder")}</span></a></li>`).join("")}</ul>` : `<p class="subtle">No makers yet.</p>`}
            <a class="text-link" href="#/explore">Open the index →</a>
          </aside>
        </div>`;
      }

      function renderExplore() {
        const directory = counts();
        const orderedMakers = makers();
        return `<h1 class="page-title">Index</h1>
          <p class="lede">Stacks, makers, and the words projects use to describe themselves.</p>
          <section class="section"><h2 class="section-label">Stacks</h2>
            ${directory.languages.length ? `<ul class="list">${directory.languages.map((language) => `<li class="list-item"><a class="list-item-title" href="#/?lang=${encodeURIComponent(language.name)}">${escapeHtml(language.name)}</a><a class="list-item-copy" href="#/project/${encodeURIComponent(language.top.id)}">${escapeHtml(language.top.title)}</a><span class="subtle tabular">${countLabel(language.count, "project")}</span></li>`).join("")}</ul>` : `<p class="subtle">Project stacks will appear here.</p>`}
          </section>
          <section class="section"><h2 class="section-label">Makers</h2>
            ${orderedMakers.length ? `<ul class="maker-grid">${orderedMakers.slice(0, 24).map((maker) => `<li><a class="maker-card" href="#/u/${encodeURIComponent(maker.handle)}">${monogram(maker.displayName)}<span class="maker-card-copy"><strong>${escapeHtml(maker.displayName)}</strong><span>${escapeHtml(maker.role || "Builder")}</span><span>${countLabel(maker.projects, "project")}${maker.location ? ` · ${escapeHtml(maker.location)}` : ""}</span></span></a></li>`).join("")}</ul>` : `<p class="subtle">Makers will appear here when someone claims a bench.</p>`}
          </section>
          ${directory.tags.length ? `<section class="section"><h2 class="section-label">Words</h2><div class="tag-cloud">${directory.tags.map((tag) => `<a class="tag-link" href="#/?q=${encodeURIComponent(tag.name)}">${escapeHtml(tag.name)}<span>${tag.count}</span></a>`).join("")}</div></section>` : ""}`;
      }

      function formField(label, name, value = "", options = {}) {
        const hint = options.hint ? `<span class="field-hint">${escapeHtml(options.hint)}</span>` : "";
        if (options.multiline) return `<div class="field"><label for="${escapeHtml(name)}">${escapeHtml(label)}</label><textarea class="textarea ${options.tall ? "tall" : ""}" id="${escapeHtml(name)}" name="${escapeHtml(name)}" maxlength="${options.max || 8000}" ${options.required ? "required" : ""} placeholder="${escapeHtml(options.placeholder || "")}">${escapeHtml(value)}</textarea>${hint}</div>`;
        return `<div class="field"><label for="${escapeHtml(name)}">${escapeHtml(label)}</label><input class="input" id="${escapeHtml(name)}" name="${escapeHtml(name)}" value="${escapeHtml(value)}" maxlength="${options.max || 200}" ${options.required ? "required" : ""} placeholder="${escapeHtml(options.placeholder || "")}" ${options.type ? `type="${options.type}"` : ""}>${hint}</div>`;
      }

      function languageOptions(selected) {
        return LANGUAGES.map((language) => `<option value="${escapeHtml(language)}" ${selected === language ? "selected" : ""}>${escapeHtml(language)}</option>`).join("");
      }

      function profileFields(profile = {}) {
        return `<div class="form-grid">${formField("Name", "displayName", profile.displayName || "", { max: 60, required: true })}${formField("Handle", "handle", profile.handle || "", { max: 24, required: true, hint: "Shown as @handle on your bench." })}</div>`;
      }

      function renderNew() {
        if (!state.user) return authRequired("Sign in to publish");
        const profile = state.data.profiles?.[state.user.uid];
        return `<div class="form-layout"><section>
          <h1 class="page-title">Publish a project</h1>
          <p class="lede">One project, described well. Title, what it does, and the writeup you would send a peer.</p>
          <form class="form" data-form="project">
            ${profile ? `<p class="muted">Publishing as <strong>@${escapeHtml(profile.handle)}</strong></p>` : profileFields({ displayName: state.user.displayName || "" })}
            ${formField("Title", "title", "", { max: 80, required: true })}
            ${formField("Summary", "summary", "", { max: 240, required: true, hint: "One sentence. It is what the record shows first." })}
            ${formField("Writeup", "body", "", { multiline: true, tall: true, hint: "Blank lines separate paragraphs. Use three backticks for code.", max: 8000 })}
            <div class="field"><label for="language">Language</label><select class="select" id="language" name="language" required>${languageOptions(LANGUAGES[0])}</select></div>
            ${formField("Tags", "tags", "", { max: 160, hint: "Comma separated. Six at most.", placeholder: "sync, files" })}
            <div class="form-grid">${formField("Repository", "repoUrl", "", { max: 200, placeholder: "https://" })}${formField("Live demo", "demoUrl", "", { max: 200, placeholder: "https://" })}</div>

            <div><button class="button primary" type="submit">Publish to the record</button></div>

        </section><aside><p class="section-label">Preview</p><article class="preview-card">${cover({ id: "draft", language: LANGUAGES[0] })}<div class="preview-card-copy"><h2>Untitled project</h2><p>The summary shows up here.</p></div></article></aside></div>`;
      }

      function authRequired(title) {
        return `<section class="auth-panel"><h1>${escapeHtml(title)}</h1><p>The record is public. Sign in only to put your name on a project, a star, or a note.</p><a class="button primary" href="#/login" style="margin-top:20px">Sign in or create an account</a></section>`;
      }

      function renderAuth() {
        const signup = state.authMode === "signup";
        if (state.user) return `<section class="auth-panel"><h1>You are signed in.</h1><p>The record is open. Publish when you have something that runs.</p><a class="button primary" href="#/">Back to the record</a></section>`;
        return `<section class="auth-panel"><h1>${signup ? "Create your account" : "Sign in"}</h1><p>${signup ? "Claim a place on the record. Your projects and profile will be public." : "The record is open. Sign in to publish, star, follow, or leave a note."}</p>
          <button class="button" type="button" data-action="google-signin" style="width:100%;margin-top:22px">Continue with Google</button>
          <p class="subtle" style="text-align:center;margin:14px 0">or use email</p>
          <form class="form" data-form="auth">
            ${signup ? formField("Name", "displayName", "", { max: 60, required: true, type: "text" }) : ""}
            ${formField("Email", "email", "", { max: 254, required: true, type: "email" })}
            ${formField("Password", "password", "", { max: 128, required: true, type: "password" })}
            <p class="form-error" aria-live="polite"></p>
            <button class="button primary" type="submit">${signup ? "Create account" : "Sign in"}</button>
          </form>
          <p style="margin-top:18px">${signup ? "Already have an account?" : "New to Mainline?"} <button class="text-link" type="button" data-action="auth-mode">${signup ? "Sign in" : "Create an account"}</button></p>
        </section>`;
      }

      function parseWriteup(body) {
        const lines = String(body || "").replaceAll("\r\n", "\n").split("\n");
        const blocks = [];
        let paragraph = [];
        let code = null;
        const flush = () => {
          const text = paragraph.join(" ").trim();
          if (text) blocks.push(`<p>${escapeHtml(text)}</p>`);
          paragraph = [];
        };
        for (const line of lines) {
          if (line.trim().startsWith("```")) {
            if (code) {
              blocks.push(`<pre><code>${escapeHtml(code.join("\n").replace(/\s+$/, ""))}</code></pre>`);
              code = null;
            } else {
              flush();
              code = [];
            }
          } else if (code) code.push(line);
          else if (!line.trim()) flush();
          else paragraph.push(line.trim());
        }
        if (code) blocks.push(`<pre><code>${escapeHtml(code.join("\n").replace(/\s+$/, ""))}</code></pre>`);
        flush();
        return blocks.join("");
      }

      function renderProject(id) {
        const project = state.data.projects?.[id];

        const profile = state.data.profiles?.[project.ownerUid] || {};
        const notes = Object.entries(state.data.notes?.[id] || {}).map(([noteId, note]) => ({ ...note, id: noteId })).sort((a, b) => Number(a.createdAt) - Number(b.createdAt));
        const owner = Boolean(state.user && state.user.uid === project.ownerUid);
        const repo = safeUrl(project.repoUrl);
        const demo = safeUrl(project.demoUrl);
        const following = isFollowing(project.ownerUid);
        const noteMarkup = notes.map((note) => `<li class="note-item"><div class="note-head"><a href="#/u/${encodeURIComponent(note.authorHandle || "")}">${escapeHtml(note.authorName || "Maker")}</a><span class="subtle mono">${escapeHtml(dateLabel(note.createdAt))}</span></div><p>${escapeHtml(note.body)}</p>${state.user?.uid === note.authorUid ? `<button class="text-link" data-action="delete-note" data-project="${escapeHtml(id)}" data-id="${escapeHtml(note.id)}">Remove note</button>` : ""}</li>`).join("");
        return `<a class="text-link" href="#/">← Record</a>${cover(prepared, "project-detail-cover")}
          <div class="detail-layout"><article>
            ${state.editingProjectId === id ? renderEditForm(project) : `<h1 class="detail-title">${escapeHtml(project.title)}</h1>
            <p class="detail-summary">${escapeHtml(project.summary)}</p>
            <div class="detail-meta"><a href="#/u/${encodeURIComponent(profile.handle || project.authorHandle || "")}">${escapeHtml(profile.displayName || project.authorName || "Maker")}</a><span>${escapeHtml(profile.role || "")}</span><span>${escapeHtml(dateLabel(project.createdAt))}</span>${starButton(prepared)}${state.user && state.user.uid !== project.ownerUid ? `<button class="button small" data-action="follow" data-handle="${escapeHtml(profile.handle || project.authorHandle || "")}">${following ? "Following" : "Follow"}</button>` : ""}</div>
            ${prepared.tags.length ? `<p class="card-tags">${escapeHtml(prepared.tags.join(" · "))}</p>` : ""}
            <div class="detail-writeup">${parseWriteup(project.body)}</div>
            ${owner ? `<div class="button-row"><button class="button" data-action="edit" data-id="${escapeHtml(id)}">Edit</button><button class="button danger" data-action="delete-project" data-id="${escapeHtml(id)}">Remove from the record</button></div>` : ""}`}
            <section class="notes"><h2>Notes</h2>${notes.length ? `<ul class="list" style="margin-top:12px">${noteMarkup}</ul>` : `<p class="subtle" style="margin-top:10px">No notes yet.</p>`}
              ${state.user ? `<form class="form note-form" data-form="note" data-project="${escapeHtml(id)}"><div class="field"><label for="note-body">Leave a note</label><textarea class="textarea" id="note-body" name="body" maxlength="800" required></textarea></div><p class="form-error" aria-live="polite"></p><button class="button primary" type="submit">Post note</button></form>` : `<div style="margin-top:18px">${authRequired("Sign in to leave a note")}</div>`}
            </section>
          </article><aside class="detail-aside"><p>${prepared.starCount} stars</p><p>${countLabel(notes.length, "note")}</p>${repo || demo ? `<div class="out-links">${repo ? `<a class="out-link" href="${escapeHtml(repo)}" target="_blank" rel="noopener noreferrer">Repository ↗</a>` : ""}${demo ? `<a class="out-link" href="${escapeHtml(demo)}" target="_blank" rel="noopener noreferrer">Live demo ↗</a>` : ""}</div>` : ""}<p style="margin-top:14px">${escapeHtml(profile.location || "")}</p></aside></div>`;
      }

      function renderEditForm(project) {
        return `<form class="form" data-form="edit-project" data-id="${escapeHtml(project.id)}">
          ${formField("Title", "title", project.title, { max: 80, required: true })}
          ${formField("Summary", "summary", project.summary, { max: 240, required: true })}
          ${formField("Writeup", "body", project.body || "", { multiline: true, tall: true, max: 8000 })}
          <div class="field"><label for="edit-language">Language</label><select class="select" id="edit-language" name="language" required>${languageOptions(project.language)}</select></div>
          ${formField("Tags", "tags", (Array.isArray(project.tags) ? project.tags : tagsFrom(project.tags)).join(", "), { max: 160 })}
          ${formField("Repository", "repoUrl", project.repoUrl || "", { max: 200 })}
          ${formField("Live demo", "demoUrl", project.demoUrl || "", { max: 200 })}
          <p class="form-error" aria-live="polite"></p><div class="button-row"><button class="button primary" type="submit">Save changes</button><button class="button" type="button" data-action="cancel-edit">Cancel</button></div>
        </form>`;
      }

      function renderProfile(handle) {
        const profile = profileByHandle(handle);
        if (!profile) return `<h1 class="page-title">No maker by that name</h1><p class="lede">That handle is not on the record.</p><a class="text-link" href="#/explore">Browse the index</a>`;
        const projects = profileProjects(profile.uid);
        const own = Boolean(state.user && state.user.uid === profile.uid);
        const following = isFollowing(profile.uid);
        const website = safeUrl(profile.website);
        const followButton = own
          ? `<a class="button" href="#/you">Edit bench</a>`
          : state.user
            ? `<button class="button" data-action="follow" data-handle="${escapeHtml(profile.handle)}">${following ? "Following" : "Follow"}</button>`
            : `<a class="button" href="#/login">Sign in to follow</a>`;
        return `<header class="profile-head">${monogram(profile.displayName)}<div><h1 class="profile-title">${escapeHtml(profile.displayName)}</h1>
          <p class="profile-meta">@${escapeHtml(profile.handle)}${profile.role ? ` · ${escapeHtml(profile.role)}` : ""}${profile.location ? ` · ${escapeHtml(profile.location)}` : ""}</p>
          ${profile.bio ? `<p class="profile-bio">${escapeHtml(profile.bio)}</p>` : ""}
          <p class="profile-stats">${countLabel(projects.length, "project")} · ${countLabel(followersOf(profile.uid), "follower")} · ${countLabel(followingCount(profile.uid), "following")}</p>
          <div class="button-row">${followButton}${website ? `<a class="button" href="${escapeHtml(website)}" target="_blank" rel="noopener noreferrer">Website ↗</a>` : ""}</div>
        </div></header><section class="section"><h2 class="side-heading">Projects</h2>${projects.length ? `<div class="project-grid">${projects.map((project) => card(project)).join("")}</div>` : `<p class="subtle">Nothing published yet.</p>`}</section>`;
      }

      function renderBench() {
        if (!state.user) return authRequired("Sign in to open your bench");
        const profile = state.data.profiles?.[state.user.uid] || null;
        const projects = profileProjects(state.user.uid);
        const starred = projectEntries().filter((project) => state.data.stars?.[project.id]?.[state.user.uid]);
        const follows = Object.keys(state.data.follows?.[state.user.uid] || {}).map((uid) => state.data.profiles?.[uid]).filter(Boolean).sort((a, b) => a.displayName.localeCompare(b.displayName));
        return `<div class="form-layout"><section><h1 class="page-title">Bench</h1><p class="lede">${profile ? "This is how you appear next to the work." : "Claim a handle. Then the projects you publish have a name on them."}</p>
          <form class="form" data-form="profile">
            ${profileFields(profile || { displayName: state.user.displayName || "" })}
            <div class="form-grid">${formField("Role", "role", profile?.role || "", { max: 60, placeholder: "Systems" })}${formField("Location", "location", profile?.location || "", { max: 60 })}</div>
            ${formField("Bio", "bio", profile?.bio || "", { multiline: true, max: 280 })}
            ${formField("Website", "website", profile?.website || "", { max: 200, placeholder: "https://" })}
            <p class="form-error" aria-live="polite"></p><button class="button primary" type="submit">${profile ? "Save bench" : "Claim handle"}</button>
          </form></section>
          <aside><section><h2 class="side-heading">Your projects</h2>${projects.length ? `<ul class="list">${projects.map((project) => `<li class="list-item" style="grid-template-columns:1fr auto"><a href="#/project/${encodeURIComponent(project.id)}">${escapeHtml(project.title)}</a><span class="subtle">${escapeHtml(project.language)}</span></li>`).join("")}</ul>` : `<p class="subtle">Nothing published yet.</p>`}<a class="text-link" href="#/new">Publish a project →</a></section>
            <section class="section"><h2 class="side-heading">Starred</h2>${starred.length ? `<ul class="list">${starred.map((project) => `<li class="list-item" style="grid-template-columns:1fr"><a href="#/project/${encodeURIComponent(project.id)}">${escapeHtml(project.title)}</a></li>`).join("")}</ul>` : `<p class="subtle">Stars you give show up here.</p>`}</section>
            <section class="section"><h2 class="side-heading">Following</h2>${follows.length ? `<ul class="list">${follows.map((maker) => `<li class="list-item" style="grid-template-columns:1fr"><a href="#/u/${encodeURIComponent(maker.handle)}">${escapeHtml(maker.displayName)}</a></li>`).join("")}</ul>` : `<p class="subtle">Makers you follow will be listed here.</p>`}</section>
          </aside></div>`;
      }

      function render() {
        const current = route();
        updateHeader(current);
        if (!state.ready) {
          appEl.innerHTML = `<p class="loading">${state.error ? "" : "Connecting to the record…"}</p>${state.error ? shellError() : ""}`;
          return;
        }
        if (state.error) {
          appEl.innerHTML = shellError();
          return;
        }
        if (current.page === "feed") appEl.innerHTML = renderFeed(current);
        else if (current.page === "explore") appEl.innerHTML = renderExplore();
        else if (current.page === "new") appEl.innerHTML = renderNew();
        else if (current.page === "you") appEl.innerHTML = renderBench();
        else if (current.page === "login") appEl.innerHTML = renderAuth();
        else if (current.page === "project") appEl.innerHTML = renderProject(current.id);
        else if (current.page === "u") appEl.innerHTML = renderProfile(current.id);
        else appEl.innerHTML = `<h1 class="page-title">Not on the record</h1><p class="lede">That page is not part of Mainline.</p><a class="text-link" href="#/">Back to the record</a>`;
      }

      function firebaseError(error) {
        const code = error?.code || "";
        const messages = {
          "auth/operation-not-allowed": "Email/Password sign-in is not enabled for this Firebase project.",
          "auth/email-already-in-use": "That email already has an account. Sign in instead.",
          "auth/invalid-email": "Enter a valid email address.",
          "auth/invalid-credential": "The email or password is not correct.",
          "auth/weak-password": "Choose a password with at least six characters.",
          "auth/popup-closed-by-user": "Google sign-in was closed before it finished.",
          "auth/popup-blocked": "Your browser blocked the Google sign-in window. Allow pop-ups and try again.",
          "auth/account-exists-with-different-credential": "An account already exists with this email. Sign in with that method first.",
          "auth/network-request-failed": "Network request failed. Check your connection and try again.",
          "database/permission-denied": "Firebase denied this request. Publish the provided Realtime Database rules.",
          "PERMISSION_DENIED": "Firebase denied this request. Publish the provided Realtime Database rules.",
        };
        return messages[code] || error?.message || "Something went wrong. Please try again.";
      }

      function profileInput(form) {
        const data = new FormData(form);
        const displayName = String(data.get("displayName") || "").trim().slice(0, 60);
        const handle = slug(data.get("handle"));
        const websiteRaw = String(data.get("website") || "").trim().slice(0, 200);
        if (displayName.length < 2) throw new Error("Add the name you want on the record.");
        if (handle.length < 2) throw new Error("Handle needs at least two letters or numbers.");
        if (websiteRaw && !safeUrl(websiteRaw)) throw new Error("Website must be an http or https link.");
        return {
          uid: state.user.uid,
          handle,
          displayName,
          role: String(data.get("role") || "").trim().slice(0, 60),
          location: String(data.get("location") || "").trim().slice(0, 60),
          bio: String(data.get("bio") || "").trim().slice(0, 280),
          website: websiteRaw ? safeUrl(websiteRaw) : "",
          createdAt: state.data.profiles?.[state.user.uid]?.createdAt || serverTimestamp(),
        };
      }

      async function saveProfile(form) {
        const profile = profileInput(form);
        const old = state.data.profiles?.[state.user.uid];
        const existingOwner = state.data.handles?.[profile.handle];
        if (existingOwner && existingOwner !== state.user.uid) throw new Error("That handle is already on the record.");
        const handleChanged = old?.handle !== profile.handle;
        if (handleChanged) await set(ref(db, `mainline/handles/${profile.handle}`), state.user.uid);
        try {
          await set(ref(db, `mainline/profiles/${state.user.uid}`), profile);
        } catch (error) {
          if (handleChanged) await remove(ref(db, `mainline/handles/${profile.handle}`));
          throw error;
        }
        if (old?.handle && handleChanged) await remove(ref(db, `mainline/handles/${old.handle}`));
        const currentUser = auth.currentUser;
        if (currentUser && currentUser.displayName !== profile.displayName) await updateProfile(currentUser, { displayName: profile.displayName });
        toast("Bench updated.");
      }

      function projectInput(form) {
        const data = new FormData(form);
        const title = String(data.get("title") || "").trim().slice(0, 80);
        const summary = String(data.get("summary") || "").trim().slice(0, 240);
        const body = String(data.get("body") || "").trim().slice(0, 8000);
        const language = String(data.get("language") || "").trim();
        const repoRaw = String(data.get("repoUrl") || "").trim().slice(0, 200);
        const demoRaw = String(data.get("demoUrl") || "").trim().slice(0, 200);
        if (title.length < 2) throw new Error("Give the project a title.");
        if (summary.length < 12) throw new Error("Add a one-line summary of what it does.");
        if (!LANGUAGES.includes(language)) throw new Error("Pick a language from the list.");
        if (repoRaw && !safeUrl(repoRaw)) throw new Error("Repository must be an http or https link.");
        if (demoRaw && !safeUrl(demoRaw)) throw new Error("Demo must be an http or https link.");
        return {
          title, summary, body, language, tags: tagsFrom(data.get("tags")).join(","),
          repoUrl: repoRaw ? safeUrl(repoRaw) : "",
          demoUrl: demoRaw ? safeUrl(demoRaw) : "",
        };
      }

      async function publishProject(form) {
        const project = projectInput(form);
        let profile = state.data.profiles?.[state.user.uid];
        const changes = {};
        if (!profile) {
          const fields = profileInput(form);
          const existingOwner = state.data.handles?.[fields.handle];
          if (existingOwner && existingOwner !== state.user.uid) throw new Error("That handle is already on the record.");
          profile = fields;
          await set(ref(db, `mainline/handles/${profile.handle}`), state.user.uid);
          try {
            await set(ref(db, `mainline/profiles/${state.user.uid}`), profile);
          } catch (error) {
            await remove(ref(db, `mainline/handles/${profile.handle}`));
            throw error;
          }
        }
        const projectRef = push(ref(db, "mainline/projects"));
        const id = projectRef.key;
        if (!id) throw new Error("Could not create a project ID.");
        changes[`mainline/projects/${id}`] = {
          ...project,
          ownerUid: state.user.uid,
          authorHandle: profile.handle,
          authorName: profile.displayName,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
        };
        if (Object.keys(changes).length) await update(ref(db), changes);
        state.editingProjectId = "";
        toast("Published to the record.");
        location.hash = `#/project/${encodeURIComponent(id)}`;
      }

      async function saveProject(form) {
        const id = form.dataset.id;
        const current = state.data.projects?.[id];
        if (!current || current.ownerUid !== state.user?.uid) throw new Error("That project is not yours to edit.");
        const project = projectInput(form);
        await update(ref(db, `mainline/projects/${id}`), { ...project, updatedAt: serverTimestamp() });
        state.editingProjectId = "";
        toast("Project updated.");
      }

      async function toggleStar(id) {
        if (!state.user) {
          location.hash = "#/login";
          return;
        }
        if (!state.data.projects?.[id]) throw new Error("Project not found.");
        const starRef = ref(db, `mainline/stars/${id}/${state.user.uid}`);
        if (state.data.stars?.[id]?.[state.user.uid]) await remove(starRef);
        else await set(starRef, true);
      }

      async function toggleFollow(handle) {
        if (!state.user) {
          location.hash = "#/login";
          return;
        }
        const profile = profileByHandle(handle);
        if (!profile) throw new Error("That maker is not on the record.");
        if (profile.uid === state.user.uid) throw new Error("You already follow your own work.");
        if (!state.data.profiles?.[state.user.uid]) throw new Error("Claim a handle on your bench before following someone.");
        const followRef = ref(db, `mainline/follows/${state.user.uid}/${profile.uid}`);
        if (state.data.follows?.[state.user.uid]?.[profile.uid]) await remove(followRef);
        else await set(followRef, true);
      }

      async function addNote(form) {
        if (!state.data.profiles?.[state.user.uid]) throw new Error("Claim a handle on your bench before leaving a note.");
        const body = String(new FormData(form).get("body") || "").trim().slice(0, 800);
        if (body.length < 2) throw new Error("Write a note before sending it.");
        const projectId = form.dataset.project;
        if (!state.data.projects?.[projectId]) throw new Error("Project not found.");
        const noteRef = push(ref(db, `mainline/notes/${projectId}`));
        await set(noteRef, {
          body,
          authorUid: state.user.uid,
          authorHandle: state.data.profiles[state.user.uid].handle,
          authorName: state.data.profiles[state.user.uid].displayName,
          createdAt: serverTimestamp(),
        });
        toast("Note posted.");
      }

      async function deleteProject(id) {
        const project = state.data.projects?.[id];
        if (!project || project.ownerUid !== state.user?.uid) throw new Error("That project is not yours to remove.");
        if (!confirm("Remove this project from the record? This cannot be undone.")) return;
        const changes = { [`mainline/projects/${id}`]: null, [`mainline/notes/${id}`]: null, [`mainline/stars/${id}`]: null };
        await update(ref(db), changes);
        location.hash = "#/";
        toast("Project removed.");
      }

      async function submitForm(form) {
        const submit = form.querySelector('[type="submit"]');
        const label = submit?.textContent || "";
        if (submit) {
          submit.disabled = true;
          submit.textContent = "Saving…";
        }
        setFormError(form, "");
        try {
          if (form.dataset.form === "auth") {
            const fields = new FormData(form);
            const email = String(fields.get("email") || "").trim();
            const password = String(fields.get("password") || "");
            if (state.authMode === "signup") {
              const displayName = String(fields.get("displayName") || "").trim().slice(0, 60);
              if (displayName.length < 2) throw new Error("Add the name you want on the record.");
              const credential = await createUserWithEmailAndPassword(auth, email, password);
              await updateProfile(credential.user, { displayName });
              toast("Account created.");
            } else {
              await signInWithEmailAndPassword(auth, email, password);
              toast("Signed in.");
            }
            location.hash = "#/";
          } else if (form.dataset.form === "profile") await saveProfile(form);
          else if (form.dataset.form === "project") await publishProject(form);
          else if (form.dataset.form === "edit-project") await saveProject(form);
          else if (form.dataset.form === "note") await addNote(form);
        } catch (error) {
          setFormError(form, firebaseError(error));
        } finally {
          if (submit?.isConnected) {
            submit.disabled = false;
            submit.textContent = label;
          }
        }
      }

      document.addEventListener("submit", (event) => {
        const form = event.target.closest("form[data-form], #search-form");
        if (!form) return;
        event.preventDefault();
        if (form.id === "search-form" || form.id === "mobile-search-form") {
          const query = String(new FormData(form).get("q") || "").trim().slice(0, 80);
          setFeedRoute({ q: query });
          return;
        }
        void submitForm(form);
      });

      document.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const { action, id, handle, lang } = button.dataset;
        try {
          if (action === "star") await toggleStar(id);
          else if (action === "follow") await toggleFollow(handle);
          else if (action === "delete-project") await deleteProject(id);
          else if (action === "delete-note") {
            const note = state.data.notes?.[button.dataset.project]?.[id];
            if (note?.authorUid !== state.user?.uid) throw new Error("That note is not yours.");
            await remove(ref(db, `mainline/notes/${button.dataset.project}/${id}`));
          } else if (action === "edit") {
            state.editingProjectId = id;
            render();
          } else if (action === "cancel-edit") {
            state.editingProjectId = "";
            render();
          } else if (action === "language") {
            const current = route();
            setFeedRoute({ q: current.q, lang: lang || "", sort: current.sort });
          } else if (action === "auth-mode") {
            state.authMode = state.authMode === "login" ? "signup" : "login";
            render();
          } else if (action === "google-signin") {
            button.disabled = true;
            button.textContent = "Opening Google…";
            await signInWithPopup(auth, new GoogleAuthProvider());
            toast("Signed in with Google.");
            location.hash = "#/";
          } else if (action === "signout") {
            await signOut(auth);
            toast("Signed out.");
            location.hash = "#/";
          } else if (action === "retry") {
            watchDatabase();
          }
        } catch (error) {
          if (action === "google-signin" && button.isConnected) {
            button.disabled = false;
            button.textContent = "Continue with Google";
          }
          toast(firebaseError(error));
        }
      });

      window.addEventListener("hashchange", () => {
        state.editingProjectId = "";
        render();
      });

      onAuthStateChanged(auth, (user) => {
        state.user = user;
        render();
      }, (error) => {
        state.error = firebaseError(error);
        state.ready = true;
        render();
      });

      function watchDatabase() {
        stopWatchingData();
        state.ready = false;
        state.error = "";
        render();
        stopWatchingData = onValue(mainlineRef, (snapshot) => {
          state.data = snapshot.val() || {};
          state.ready = true;
          state.error = "";
          render();
        }, (error) => {
          state.error = firebaseError(error);
          state.ready = true;
          render();
        });
      }

      watchDatabase();
      render();
    </script>
  </body>
</html>
